<style>
  body{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:14px max(14px,env(safe-area-inset-right,0px)) 14px max(14px,env(safe-area-inset-left,0px))}
  .card{width:100%;max-width:400px;border-radius:28px;overflow:hidden;position:relative;
    background:#FAF7F2;border:0;box-shadow:var(--sombra-alta);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .foto{position:relative;aspect-ratio:1/1;max-height:62svh;min-height:300px;background:#FAF7F2}
  .foto img{width:100%;height:100%;transform:scale(1.006);object-fit:cover;object-position:50% 12%}
  .foto::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-2px;height:34%;pointer-events:none;
    background:linear-gradient(180deg,rgba(250,247,242,0) 0%,rgba(250,247,242,.38) 28%,rgba(250,247,242,.78) 52%,rgba(250,247,242,.96) 70%,#FAF7F2 80%,#FAF7F2 100%)}
  .lugar{z-index:2}
  .lugar{position:absolute;top:12px;left:12px;display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:500;color:var(--tinta);
    background:rgba(250,247,242,.72);border:1px solid rgba(255,255,255,.65);padding:4px 9px;border-radius:999px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .lugar svg{width:11px;height:11px;color:var(--cafe)}
  .id{text-align:center;margin-top:-30px;position:relative;z-index:1;padding:0 20px}
  .logo{display:block;width:100%;max-width:320px;height:auto;margin:0 auto}
  .nm{font-size:56px;color:var(--cafe);margin:0;letter-spacing:.005em;white-space:nowrap}
  .ap{margin:2px 0 0;font-size:20px;font-weight:400;letter-spacing:.32em;text-transform:uppercase;color:var(--tinta);padding-left:.32em}
  .rol{margin:12px 0 0;font-size:12.5px;color:var(--suave);letter-spacing:.02em}
  .rol .sep{color:var(--oro);margin:0 7px}
  .cuerpo{padding:18px 18px 6px;display:grid;gap:12px}
  .titulo-sec{display:flex;align-items:center;gap:10px;margin:2px 2px -2px}
  .titulo-sec::after{content:"";flex:1;height:1px;background:var(--linea)}
  .mini{display:flex;justify-content:center;gap:6px;padding:4px 0 14px}
  .mini a,.mini button{background:none;border:0;font:500 12.5px "Poppins",sans-serif;color:var(--suave);display:inline-flex;gap:6px;align-items:center;cursor:pointer;text-decoration:none;padding:8px 10px;border-radius:10px}
  .mini a:hover,.mini button:hover{color:var(--cafe);background:var(--crema)}
  .mini svg{width:15px;height:15px}
  .mini .div{width:1px;background:var(--linea);margin:8px 0}
</style>
</head>
<body class="fondo">
<main class="card">
  <div class="foto">
    <img src="assets/foto-principal.jpg" alt="María Camila Chala Mena" width="880" height="880" fetchpriority="high">
    <span class="lugar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg><span id="ciudad"></span></span>
  </div>
  <div class="id">
    <h1 style="margin:0"><img class="logo" src="assets/logo-nombre.png" alt="María Camila Chala Mena" width="900" height="229"></h1>
    <p class="rol" id="rol"></p>
  </div>
  <div class="cuerpo">
    <div id="agenda"></div>
    <div id="contacto"></div>
    <div class="titulo-sec"><span class="etq">Proyectos</span></div>
    <div id="sitios"></div>
    <a class="btn2" href="hoja-de-vida.html" id="ver-cv"></a>
  </div>
  <div class="mini">
    <a href="contacto.vcf" download="Maria-Camila-Chala-Mena.vcf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>Guardar contacto</a>
    <span class="div" aria-hidden="true"></span>
    <button type="button" id="compartir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>Compartir</button>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="datos.js"></script>
<script src="comun.js"></script>
<script>
  const { D, ICON, esc, botonAgenda, iconosContacto, botonesSitios, compartir } = window.UI;
  const $ = s => document.getElementById(s);
  $('rol').innerHTML = D.tarjetaRol.split('·').map(t => esc(t.trim())).join('<span class="sep">·</span>');
  $('ciudad').textContent = D.ciudad;
  $('agenda').innerHTML = botonAgenda();
  $('contacto').innerHTML = iconosContacto();
  $('sitios').innerHTML = botonesSitios();
  $('ver-cv').innerHTML = ICON.doc + 'Ver hoja de vida';
  $('compartir').onclick = () => compartir(location.href.split('#')[0], 'María Camila Chala Mena · Tarjeta de contacto');
</script>
</body>
</html>
